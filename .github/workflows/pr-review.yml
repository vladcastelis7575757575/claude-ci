name: PR Review with Progress Tracking

# Reviews every PR with the instructions held in .claude/agents/pr-reviewer.md.
#
# Two things are load-bearing here:
#  - `prompt` is what puts the action in automation mode. Without it the action
#    auto-detects "tag" mode and waits for an @claude mention that a
#    pull_request event can never carry, so the job exits green without
#    reviewing anything.
#  - the reviewer instructions are read from the file and inlined below, rather
#    than delegated to the subagent, so the review does not depend on subagent
#    discovery inside the action's sandbox. The file stays the single source of
#    truth: edit it, not this workflow.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

env:
  REVIEWER_FILE: .claude/agents/pr-reviewer.md

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Load reviewer instructions
        id: reviewer
        run: |
          if [ ! -f "$REVIEWER_FILE" ]; then
            echo "::error::$REVIEWER_FILE not found - cannot run the review"
            exit 1
          fi
          # Strip the YAML frontmatter, keep the instructions themselves.
          {
            echo 'body<<CLAUDE_REVIEWER_EOF'
            awk 'NR==1 && /^---[[:space:]]*$/ {fm=1; next}
                 fm && /^---[[:space:]]*$/ {fm=0; next}
                 !fm' "$REVIEWER_FILE"
            echo 'CLAUDE_REVIEWER_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Enable progress tracking
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following, to the letter, the reviewer
            instructions below. They come from ${{ env.REVIEWER_FILE }} and are
            the only brief for this review: do not substitute your own review
            format, severity levels or output structure for theirs.

            ---BEGIN REVIEWER INSTRUCTIONS---
            ${{ steps.reviewer.outputs.body }}
            ---END REVIEWER INSTRUCTIONS---

          # Read/Grep/Glob are the tools the reviewer file declares and needs for
          # its step 0 (read CLAUDE.md and the surrounding code); the gh commands
          # and the inline-comment tool are how it reports.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model claude-haiku-4-5-20251001
            --max-turns 40
            --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

# When track_progress is enabled:
# - Creates a tracking comment with progress checkboxes
# - Includes all PR context (comments, attachments, images)
# - Updates progress as the review proceeds
# - Marks as completed when done
